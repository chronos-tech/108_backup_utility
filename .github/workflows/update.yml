name: Update cache

# Fetches pending pages, age-encrypts them and updates metadata.
# Triggers: daily, manual (with options), or repository_dispatch (event type: update-cache).
# Schedule and repository_dispatch always download everything and never fetch premium.
on:
  schedule:
    - cron: "43 4 * * *"     # daily, 04:43 UTC
  workflow_dispatch:
    inputs:
      download_all:
        description: "Download all eligible pages (untick to download only the first 10 valid pages)"
        required: false
        default: true
        type: boolean
      fetch_premium:
        description: "Fetch premium pages when the authenticated session has access"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [update-cache]

permissions:
  contents: write

concurrency:
  group: repo-data-writers
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Update cache
        env:
          BASE_URL: ${{ secrets.BASE_URL || vars.BASE_URL }}
          AES_KEY: ${{ secrets.AES_KEY }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          MAX_WORKERS: ${{ vars.MAX_WORKERS }}
          REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT }}
          # Manual run with "download_all" unticked -> stop after 10 valid pages.
          # Every other trigger -> 0 = download all.
          MAX_VALID_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.download_all == false && '10' || '0' }}
          # Scheduled / dispatch runs: false. The cookie is only exposed when premium is requested.
          FETCH_PREMIUM: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_premium == true }}
          COOKIE: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_premium == true && secrets.COOKIE || '' }}
          # Stop gracefully well before the job timeout so the commit step still has time.
          MAX_RUNTIME_MINUTES: "320"
        run: |
          # Checkpoint: commit progress every 20 min so a runner crash loses little.
          STOP="$RUNNER_TEMP/stop-checkpoints"; rm -f "$STOP"
          (
            n=0
            while [ ! -e "$STOP" ]; do
              sleep 5; n=$((n + 5))
              if [ "$n" -ge 1200 ]; then
                n=0
                COMMIT_BEST_EFFORT=1 bash scripts/commit_push.sh "chore: checkpoint encrypted cache" || true
              fi
            done
          ) &
          SIDE=$!
          trap 'touch "$STOP"; wait "$SIDE" 2>/dev/null || true' EXIT
          python update.py

      - name: Commit and push metadata and encrypted cache
        # always(): also runs after failure, cancellation or timeout so progress is never dropped.
        if: ${{ always() }}
        run: |
          bash scripts/commit_push.sh "chore: update encrypted cache"
